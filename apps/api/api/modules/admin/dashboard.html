<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Followw Admin</title>
<link rel="stylesheet" href="/api/admin/assets/dashboard.css">
</head>
<body>
<form id="login" hidden>
  <span class="brand-mark" aria-hidden="true">F</span>
  <span class="eyebrow">Followw · Administração</span>
  <h1 id="login-title">Acesso à administração</h1>
  <p class="muted" id="login-hint"></p>
  <fieldset id="credentials">
    <label>Pseudônimo <input id="user" autocomplete="username" required maxlength="64"></label>
    <label>Senha <input id="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <label id="repeat-password" hidden>Repita a senha <input id="password2" type="password" autocomplete="new-password" maxlength="256"></label>
  </fieldset>
  <section id="mfa-fields" hidden><div id="qr-area"></div><label>Código do autenticador ou recuperação<input id="factor" autocomplete="one-time-code" maxlength="64"></label></section>
  <button class="primary" id="auth-submit" type="submit">Continuar</button>
  <button class="ghost" id="back-login" type="button">Voltar ao acesso</button>
  <p class="error" id="login-error" role="alert"></p>
  <p class="muted">Perdeu os fatores? A recuperação do Owner exige acesso ao terminal do servidor. Não existe recuperação por matrícula ou e-mail.</p>
</form>

<div id="app">
  <nav aria-label="Seções">
    <div class="brand"><span class="brand-mark" aria-hidden="true">F</span><h1>Followw</h1><span class="muted">Central de administração</span><span class="muted" id="who"></span></div>
    <span class="nav-label">Acompanhamento</span>
    <button data-view="overview" data-permission="operations">Visão geral</button>
    <button data-view="usage" data-permission="operations">Uso e estatísticas</button>
    <button data-view="operations" data-permission="operations">Operações e atividade</button>
    <button data-view="breakdown" data-permission="operations">Distribuições</button>
    <button data-view="sync" data-permission="operations">Sincronização e catálogos</button>
    <span class="nav-label">Comunidade</span>
    <button data-view="moderation" data-permission="moderate">Moderação <span class="count" id="pending-count" hidden></span></button>
    <button data-view="data" data-permission="moderate">Conteúdo compartilhado</button>
    <button data-view="support" data-permission="support">Chamados de suporte</button>
    <span class="nav-label">Instalação</span>
    <button data-view="accounts" data-permission="accounts">Equipe e permissões</button>
    <button data-view="system" data-permission="operations">Sistema e armazenamento</button>
    <button data-view="audit" data-permission="audit">Auditoria</button>
    <button data-view="logs" data-permission="audit">Registros técnicos</button>
    <button data-view="limits" data-permission="configure">Limites da comunidade</button>
    <button data-view="demo" data-permission="owner">Dados de demonstração</button>
    <button data-view="security">Minha segurança</button>
    <div class="spacer"></div>
    <button id="theme" type="button">Alternar tema</button>
    <button id="logout">Sair</button>
  </nav>
  <main id="main"></main>
</div>
<dialog id="drawer" aria-label="Detalhes"></dialog>
<dialog id="confirmation" aria-label="Confirmar operação"></dialog>
<output id="notice" aria-live="polite" hidden></output>
<div id="tooltip"></div>

<script type="module" src="/api/admin/assets/dashboard.js"></script>
</body>
</html>
