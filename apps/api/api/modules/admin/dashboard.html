<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Followw Admin</title>
<style>
  :root {
    --bg:#f4f6f5; --panel:#ffffff; --side:#eef2f0; --fg:#121614; --muted:#5d6763; --line:#dfe5e2;
    --primary:#007c5d; --primary-ink:#ffffff; --primary-soft:#d9efe7; --danger:#c2412d; --warn:#9a6a00; --warn-soft:#fbf1d9;
    --chart:#1f8a6b; --chart-soft:#a9d8c7; --grid:#e8edea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0e1110; --panel:#161a18; --side:#121614; --fg:#eef3f0; --muted:#94a09a; --line:#29302c;
      --primary:#4dbb94; --primary-ink:#06140f; --primary-soft:#173a2e; --danger:#ef7a66; --warn:#e2b04a; --warn-soft:#3a2f12;
      --chart:#4dbb94; --chart-soft:#24584a; --grid:#222825;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { background:var(--side); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:var(--muted); }
  button.primary { background:var(--primary); color:var(--primary-ink); border-color:var(--primary); font-weight:600; }
  button.danger { background:transparent; color:var(--danger); border-color:var(--danger); }
  button.ghost { background:transparent; border-color:transparent; }
  button:disabled { opacity:.5; cursor:default; }
  input, select, textarea { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
  textarea { width:100%; min-height:220px; resize:vertical; }
  h1 { font-size:18px; margin:0; } h2 { font-size:16px; margin:0; } h3 { font-size:14px; margin:0 0 8px; }
  .muted { color:var(--muted); font-size:12px; }
  .error { color:var(--danger); font-size:13px; }
  #login { max-width:380px; margin:14vh auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:12px; }
  #login label { display:flex; flex-direction:column; gap:4px; font-size:13px; }
  #app { display:none; min-height:100vh; grid-template-columns:220px 1fr; }
  #app.ready { display:grid; }
  nav { background:var(--side); border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; }
  nav .brand { padding:0 8px 14px; }
  nav button { text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; }
  nav button[aria-current="page"] { background:var(--primary-soft); color:var(--fg); font-weight:600; }
  nav .spacer { flex:1; }
  .count { background:var(--warn-soft); color:var(--warn); border-radius:999px; padding:0 8px; font-size:11px; font-weight:700; }
  main { padding:22px 28px; display:flex; flex-direction:column; gap:16px; min-width:0; }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .toolbar .grow { flex:1; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; min-width:0; }
  .grid { display:grid; gap:12px; }
  .g4 { grid-template-columns:repeat(4, minmax(0,1fr)); } .g3 { grid-template-columns:repeat(3, minmax(0,1fr)); } .g2 { grid-template-columns:repeat(2, minmax(0,1fr)); }
  .tile .value { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  .tile .label { color:var(--muted); font-size:12px; }
  .tile.warn .value { color:var(--warn); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--side); }
  .clip { max-width:520px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { display:inline-block; border-radius:999px; padding:1px 8px; font-size:11px; background:var(--side); border:1px solid var(--line); margin:0 4px 2px 0; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .tabs button[aria-pressed="true"] { background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }
  .pre { white-space:pre-wrap; overflow-wrap:anywhere; }
  .list > div { border-top:1px solid var(--line); padding:12px 0; display:flex; gap:12px; }
  .list > div:first-child { border-top:0; }
  .list .item { flex:1; min-width:0; }
  .actions { display:flex; gap:6px; flex-shrink:0; align-items:flex-start; }
  .meter { height:8px; border-radius:8px; background:var(--grid); overflow:hidden; margin-top:6px; }
  .meter span { display:block; height:100%; background:var(--chart); }
  .chart { width:100%; height:220px; display:block; }
  .chart text { fill:var(--muted); font-size:11px; }
  .chart .gridline { stroke:var(--grid); }
  .chart .bar { fill:var(--chart); }
  .chart .bar:hover, .chart .hit:hover + .bar { fill:var(--primary); }
  .hbars { display:flex; flex-direction:column; gap:6px; }
  .hbar { display:grid; grid-template-columns:140px 1fr 48px; gap:8px; align-items:center; font-size:13px; }
  .hbar .track { height:12px; background:var(--grid); border-radius:6px; overflow:hidden; }
  .hbar .fill { height:100%; background:var(--chart); border-radius:6px; }
  .hbar .n { text-align:right; font-variant-numeric:tabular-nums; }
  #tooltip { position:fixed; pointer-events:none; background:var(--fg); color:var(--bg); font-size:12px; padding:4px 8px; border-radius:6px; display:none; z-index:10; }
  #drawer { position:fixed; inset:0 0 0 auto; width:min(640px, 100%); background:var(--panel); border-left:1px solid var(--line); box-shadow:-8px 0 24px rgba(0,0,0,.15); padding:20px; overflow:auto; display:none; z-index:5; }
  #drawer.open { display:block; }
  dl { display:grid; grid-template-columns:150px 1fr; gap:6px 12px; margin:12px 0; }
  dt { color:var(--muted); font-size:12px; } dd { margin:0; overflow-wrap:anywhere; white-space:pre-wrap; }
  .switch { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .switch:first-of-type { border-top:0; }
  .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:10px; }
  .notice { background:var(--warn-soft); color:var(--warn); border-radius:8px; padding:8px 12px; font-size:13px; }
  @media (max-width: 900px) { #app.ready { grid-template-columns:1fr; } nav { position:static; height:auto; flex-direction:row; flex-wrap:wrap; } .g4, .g3, .g2 { grid-template-columns:1fr 1fr; } main { padding:16px; } }
</style>
</head>
<body>
<form id="login" hidden>
  <h1>Followw · Administração</h1>
  <p class="muted" id="login-hint">Entre com o usuário e a senha definidos por <code>uv run admin-password</code>.</p>
  <label>Usuário <input id="user" autocomplete="username" required maxlength="64"></label>
  <label>Senha <input id="password" type="password" autocomplete="current-password" required maxlength="256"></label>
  <button class="primary" type="submit">Entrar</button>
  <p class="error" id="login-error" role="alert"></p>
</form>

<div id="app">
  <nav aria-label="Seções">
    <div class="brand"><h1>Followw</h1><span class="muted" id="who"></span></div>
    <button data-view="overview">Visão geral</button>
    <button data-view="usage">Uso</button>
    <button data-view="moderation">Moderação <span class="count" id="pending-count" hidden></span></button>
    <button data-view="data">Dados</button>
    <button data-view="breakdown">Distribuições</button>
    <button data-view="system">Sistema</button>
    <div class="spacer"></div>
    <button id="logout">Sair</button>
  </nav>
  <main id="main"></main>
</div>
<div id="drawer" role="dialog" aria-modal="true" aria-label="Detalhes"></div>
<div id="tooltip"></div>

<script>
"use strict";
const base = location.pathname.replace(/\/admin\/?$/, "") + "/admin/api";
const $ = (selector) => document.querySelector(selector);
const LABELS = { review:"Avaliações", group:"Grupos", material:"Materiais", post:"Publicações", reply:"Respostas", tutorial:"Guias", report:"Denúncias" };
const REASONS = { ofensivo:"Ofensivo", dados_pessoais:"Expõe alguém", spam:"Spam", falso:"Falso", direitos_autorais:"Direitos autorais", outro:"Outro" };
const STATUS = { pending:"Pendentes", accepted:"Aceitas", rejected:"Recusadas", approved:"Aprovados" };
const state = { view:"overview", days:30, metric:"alunos ativos", data:{ kind:"review", page:1, q:"", status:"", subject:"", days:"" }, reports:"pending", tutorials:"pending" };

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const svg = (tag, attrs = {}) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  return node;
};
const fmt = (n) => new Intl.NumberFormat("pt-BR").format(n);
const bytes = (n) => { const u = ["B","KB","MB","GB","TB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return `${n.toFixed(i ? 1 : 0)} ${u[i]}`; };
const when = (iso) => new Date(iso).toLocaleString("pt-BR", { dateStyle:"short", timeStyle:"short" });
const duration = (s) => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}min` : `${m}min`; };

async function call(path, options = {}) {
  const headers = { "X-Admin-Request": "1" };
  if (options.body) headers["Content-Type"] = "application/json";
  const response = await fetch(base + path, { ...options, headers, credentials:"same-origin", cache:"no-store" });
  if (response.status === 401) { showLogin(); throw new Error("Sessão encerrada."); }
  if (!response.ok) {
    let detail = `Erro ${response.status}`;
    try { const body = await response.json(); if (typeof body.detail === "string") detail = body.detail; } catch {}
    throw new Error(detail);
  }
  return response.status === 204 ? null : response.json();
}

function showLogin(message) {
  $("#app").classList.remove("ready");
  $("#login").hidden = false;
  $("#login-error").textContent = message || "";
  $("#user").focus();
}

let setupMode = false;
$("#login").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (setupMode) return;
  $("#login-error").textContent = "";
  try {
    const response = await fetch(base + "/login", {
      method:"POST", credentials:"same-origin",
      headers:{ "Content-Type":"application/json", "X-Admin-Request":"1" },
      body:JSON.stringify({ username:$("#user").value, password:$("#password").value }),
    });
    $("#password").value = "";
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      $("#login-error").textContent = body.detail || "Não foi possível entrar.";
      return;
    }
    await start();
  } catch { $("#login-error").textContent = "Sem conexão com a API."; }
});

$("#logout").addEventListener("click", async () => {
  await fetch(base + "/logout", { method:"POST", credentials:"same-origin", headers:{ "X-Admin-Request":"1" } });
  showLogin("Você saiu.");
});

for (const button of document.querySelectorAll("nav [data-view]")) {
  button.addEventListener("click", () => { state.view = button.dataset.view; render(); });
}

async function start() {
  const session = await fetch(base + "/session", { credentials:"same-origin", cache:"no-store" }).then((r) => r.json()).catch(() => null);
  if (!session) { showLogin("Sem conexão com a API."); return; }
  if (!session.enabled && session.setup) { showSetup(); return; }
  if (!session.enabled) {
    $("#login").hidden = false;
    $("#login-hint").textContent = "Painel desligado: defina usuário e senha com `uv run admin-password` (pasta apps/api) e reinicie a API.";
    for (const input of $("#login").querySelectorAll("input, button")) input.disabled = true;
    return;
  }
  if (!session.user) { showLogin(); return; }
  $("#login").hidden = true;
  $("#app").classList.add("ready");
  $("#who").textContent = session.user;
  render();
}

function showSetup() {
  setupMode = true;
  $("#login").hidden = false;
  $("#login").querySelector("h1").textContent = "Criar o acesso do administrador";
  $("#login-hint").textContent = "Primeiro acesso neste computador: escolha usuário e senha (mínimo 12 caracteres). Só o hash da senha é guardado em apps/api/.env.";
  const button = $("#login").querySelector("button");
  button.textContent = "Criar e entrar";
  const confirm = el("input", { id:"password2", type:"password", autocomplete:"new-password", required:true, maxlength:"256" });
  $("#password").setAttribute("autocomplete", "new-password");
  $("#password").after(el("span", { class:"muted" }, "Repita a senha"), confirm);
  $("#login").onsubmit = async (event) => {
    event.preventDefault();
    event.stopImmediatePropagation();
    if ($("#password").value !== confirm.value) { $("#login-error").textContent = "As senhas não conferem."; return; }
    const response = await fetch(base + "/setup", { method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json", "X-Admin-Request":"1" }, body:JSON.stringify({ username:$("#user").value, password:$("#password").value }) });
    $("#password").value = ""; confirm.value = "";
    if (!response.ok) { const body = await response.json().catch(() => ({})); $("#login-error").textContent = typeof body.detail === "string" ? body.detail : "Use de 3 a 64 letras, números, ponto, hífen ou sublinhado no usuário e 12+ caracteres na senha."; return; }
    location.reload();
  };
}

async function render() {
  for (const button of document.querySelectorAll("nav [data-view]")) {
    if (button.dataset.view === state.view) button.setAttribute("aria-current", "page");
    else button.removeAttribute("aria-current");
  }
  const main = $("#main");
  main.replaceChildren(el("p", { class:"muted" }, "Carregando…"));
  try {
    const views = { overview, usage, moderation, data, breakdown, system };
    main.replaceChildren(...await views[state.view]());
  } catch (error) {
    main.replaceChildren(el("p", { class:"error" }, error.message));
  }
  updatePending();
}

async function updatePending() {
  try {
    const o = await call("/overview");
    const total = o.pending["denúncias"] + o.pending["guias"];
    $("#pending-count").hidden = !total;
    $("#pending-count").textContent = total;
  } catch {}
}

function tile(label, value, warn) {
  return el("div", { class:`panel tile${warn ? " warn" : ""}` }, el("div", { class:"value" }, value), el("div", { class:"label" }, label));
}

function header(title, ...actions) {
  return el("div", { class:"toolbar" }, el("h2", { class:"grow" }, title), ...actions);
}

function barChart(labels, values, { format = fmt, height = 220 } = {}) {
  const width = 900, pad = { l:40, r:8, t:10, b:26 };
  const chart = svg("svg", { class:"chart", viewBox:`0 0 ${width} ${height}`, role:"img", "aria-label":"Gráfico de barras" });
  const max = Math.max(1, ...values);
  const step = (width - pad.l - pad.r) / Math.max(1, values.length);
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (height - pad.t - pad.b) * (1 - i / 4);
    chart.append(svg("line", { class:"gridline", x1:pad.l, x2:width - pad.r, y1:y, y2:y }));
    const label = svg("text", { x:pad.l - 6, y:y + 4, "text-anchor":"end" });
    label.textContent = fmt(Math.round(max * i / 4));
    chart.append(label);
  }
  const every = Math.ceil(values.length / 12);
  values.forEach((value, i) => {
    const h = (height - pad.t - pad.b) * (value / max);
    const x = pad.l + i * step;
    const hit = svg("rect", { class:"hit", x, y:pad.t, width:step, height:height - pad.t - pad.b, fill:"transparent" });
    const bar = svg("rect", { class:"bar", x:x + step * 0.15, y:height - pad.b - h, width:Math.max(1, step * 0.7), height:Math.max(0, h), rx:Math.min(4, step * 0.3) });
    const show = (event) => tooltip(event, `${labels[i]}: ${format(value)}`);
    for (const target of [hit, bar]) { target.addEventListener("mousemove", show); target.addEventListener("mouseleave", hideTooltip); }
    chart.append(hit, bar);
    if (i % every === 0) {
      const label = svg("text", { x:x + step / 2, y:height - 8, "text-anchor":"middle" });
      label.textContent = labels[i].length > 7 ? labels[i].slice(5) : labels[i];
      chart.append(label);
    }
  });
  return chart;
}

function hbars(entries, labeler = (k) => k) {
  const max = Math.max(1, ...entries.map(([, n]) => n));
  if (!entries.length) return el("p", { class:"muted" }, "Sem dados ainda.");
  return el("div", { class:"hbars" }, entries.map(([key, n]) =>
    el("div", { class:"hbar" }, el("span", { class:"clip" }, labeler(key)),
      el("div", { class:"track" }, el("div", { class:"fill", style:`width:${(n / max * 100).toFixed(1)}%` })),
      el("span", { class:"n" }, fmt(n)))));
}

function tooltip(event, text) {
  const tip = $("#tooltip");
  tip.textContent = text;
  tip.style.display = "block";
  tip.style.left = `${event.clientX + 12}px`;
  tip.style.top = `${event.clientY - 28}px`;
}
function hideTooltip() { $("#tooltip").style.display = "none"; }

async function overview() {
  const [o, s] = await Promise.all([call("/overview"), call("/series?days=30")]);
  const users = s.series["alunos ativos"];
  return [
    header("Visão geral", el("button", { onclick:render }, "Atualizar")),
    el("div", { class:"grid g4" },
      tile("Alunos ativos hoje", fmt(o.users["hoje"])),
      tile("Alunos nesta semana", fmt(o.users["esta semana"])),
      tile("Alunos neste mês", fmt(o.users["este mês"])),
      tile("Pendências de moderação", fmt(o.pending["denúncias"] + o.pending["guias"]), o.pending["denúncias"] + o.pending["guias"] > 0)),
    el("div", { class:"panel" }, el("h3", {}, "Alunos ativos por dia (30 dias)"),
      el("p", { class:"muted" }, "Contados por chaves anônimas por dia: dá para saber quantos, nunca quem."),
      barChart(s.days, users)),
    el("div", { class:"grid g4" }, Object.entries(o.counts).map(([label, n]) => tile(label, fmt(n)))),
    el("div", { class:"grid g3" },
      tile("Banco de dados", bytes(o.database_bytes)),
      tile("Arquivos de materiais (cifrados)", bytes(o.materials_bytes)),
      tile("API no ar há", duration(o.uptime_seconds))),
    o.demo_data ? el("p", { class:"notice" }, "Dados de demonstração ligados (DEMO_DATA). Desligue em produção.") : null,
  ];
}

async function usage() {
  const s = await call(`/series?days=${state.days}`);
  const metrics = Object.keys(s.series);
  if (!metrics.includes(state.metric)) state.metric = metrics[0];
  const periods = el("div", { class:"tabs" }, [7, 30, 90, 180, 365].map((days) =>
    el("button", { "aria-pressed":String(state.days === days), onclick:() => { state.days = days; render(); } }, `${days} dias`)));
  const metric = el("select", { "aria-label":"Métrica", onchange:(e) => { state.metric = e.target.value; render(); } },
    metrics.map((m) => el("option", { value:m, selected:m === state.metric }, m)));
  const values = s.series[state.metric];
  const total = values.reduce((a, b) => a + b, 0);
  return [
    header("Uso", periods, metric),
    el("div", { class:"grid g3" },
      tile(`Total no período: ${state.metric}`, fmt(total)),
      tile("Média por dia", (total / values.length).toLocaleString("pt-BR", { maximumFractionDigits:1 })),
      tile("Maior dia", fmt(Math.max(0, ...values)))),
    el("div", { class:"panel" }, el("h3", {}, `${state.metric} por dia`), barChart(s.days, values)),
    el("div", { class:"grid g2" },
      el("div", { class:"panel" }, el("h3", {}, "Alunos únicos por semana"), barChart(s.weeks.map((w) => w.period), s.weeks.map((w) => w.users), { height:180 })),
      el("div", { class:"panel" }, el("h3", {}, "Alunos únicos por mês"), barChart(s.months.map((m) => m.period), s.months.map((m) => m.users), { height:180 }))),
    el("div", { class:"panel" }, el("h3", {}, "Totais no período"),
      el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Métrica"), el("th", { class:"num" }, "Total"))),
        el("tbody", {}, Object.entries(s.totals).map(([k, n]) => el("tr", {}, el("td", {}, k), el("td", { class:"num" }, fmt(n))))))),
  ];
}

async function moderation() {
  const [reports, tutorials] = await Promise.all([call(`/reports?status=${state.reports}`), call(`/tutorials?status=${state.tutorials}`)]);
  const reportTabs = el("div", { class:"tabs" }, ["pending", "accepted", "rejected"].map((s) =>
    el("button", { "aria-pressed":String(state.reports === s), onclick:() => { state.reports = s; render(); } }, STATUS[s])));
  const tutorialTabs = el("div", { class:"tabs" }, ["pending", "approved", "rejected"].map((s) =>
    el("button", { "aria-pressed":String(state.tutorials === s), onclick:() => { state.tutorials = s; render(); } }, STATUS[s])));
  const act = async (path, action, confirmText) => {
    if (confirmText && !confirm(confirmText)) return;
    try { await call(path, { method:"POST", body:JSON.stringify({ action }) }); render(); } catch (error) { alert(error.message); }
  };
  return [
    header("Moderação"),
    el("div", { class:"panel" }, el("div", { class:"toolbar" }, el("h3", { class:"grow" }, "Denúncias e pedidos de exclusão"), reportTabs),
      reports.length ? el("div", { class:"list" }, reports.map((r) => el("div", {},
        el("div", { class:"item" },
          el("span", { class:"badge" }, LABELS[r.target_type] || r.target_type), el("span", { class:"badge" }, REASONS[r.reason] || r.reason),
          el("span", { class:"muted" }, when(r.created_at)),

          el("button", { class:"danger", onclick:() => act(`/reports/${r.id}`, "accept", "Apagar o conteúdo denunciado? Não dá para desfazer.") }, "Apagar conteúdo"),
          el("button", { onclick:() => act(`/reports/${r.id}`, "reject") }, "Manter")) : null)))
      : el("p", { class:"muted" }, "Nada aqui.")),
    el("div", { class:"panel" }, el("div", { class:"toolbar" }, el("h3", { class:"grow" }, "Guias da UnB"), tutorialTabs),
      tutorials.length ? el("div", { class:"list" }, tutorials.map((t) => el("div", {},
        el("div", { class:"item" },
          el("strong", {}, t.title), " ", el("span", { class:"badge" }, t.category), el("span", { class:"muted" }, when(t.created_at)),
          el("p", { class:"muted" }, t.summary),
          el("details", {}, el("summary", {}, "Ler o guia"), el("p", { class:"pre" }, t.body))),
        el("div", { class:"actions" },
          el("button", { onclick:() => editTutorial(t) }, "Editar"),
          t.status !== "approved" ? el("button", { class:"primary", onclick:() => act(`/tutorials/${t.id}`, "accept") }, "Aprovar") : null,
          t.status !== "rejected" ? el("button", { class:"danger", onclick:() => act(`/tutorials/${t.id}`, "reject") }, t.status === "approved" ? "Despublicar" : "Recusar") : null))))
      : el("p", { class:"muted" }, "Nada aqui.")),
  ];
}

function editTutorial(t) {
  const title = el("input", { value:t.title, maxlength:"120" });
  const summary = el("input", { value:t.summary, maxlength:"240" });
  const category = el("input", { value:t.category, maxlength:"24" });
  const body = el("textarea", { maxlength:"20000" }, t.body);
  const error = el("p", { class:"error" });
  openDrawer(el("h2", {}, "Editar guia"),
    el("label", {}, "Título", title), el("label", {}, "Resumo", summary), el("label", {}, "Categoria", category), el("label", {}, "Texto (Markdown)", body), error,
    el("div", { class:"toolbar" }, el("button", { class:"primary", onclick:async () => {
      try {
        await call(`/tutorials/${t.id}`, { method:"PUT", body:JSON.stringify({ title:title.value, summary:summary.value, category:category.value, body:body.value }) });
        closeDrawer(); render();
      } catch (e) { error.textContent = e.message; }
    } }, "Salvar"), el("button", { onclick:closeDrawer }, "Cancelar")));
}

async function data() {
  const d = state.data;
  const params = new URLSearchParams({ page:d.page, page_size:25 });
  for (const key of ["q", "status", "subject", "days"]) if (d[key]) params.set(key, d[key]);
  const page = await call(`/content/${d.kind}?${params}`);
  const kinds = el("div", { class:"tabs" }, Object.entries(LABELS).map(([kind, label]) =>
    el("button", { "aria-pressed":String(d.kind === kind), onclick:() => { Object.assign(d, { kind, page:1, status:"" }); render(); } }, label)));
  const q = el("input", { type:"search", placeholder:"Buscar no conteúdo (decifrado)", value:d.q, maxlength:"32" });
  const subject = el("input", { placeholder:"Matéria (ex.: FGA0030)", value:d.subject, maxlength:"16", size:"16" });
  const days = el("select", { "aria-label":"Período" }, [["", "Todo o período"], ["1", "Último dia"], ["7", "7 dias"], ["30", "30 dias"], ["90", "90 dias"], ["365", "1 ano"]].map(([v, l]) => el("option", { value:v, selected:d.days === v }, l)));
  const statuses = { tutorial:["", "pending", "approved", "rejected"], report:["", "pending", "accepted", "rejected"] }[d.kind];
  const status = statuses ? el("select", { "aria-label":"Situação" }, statuses.map((s) => el("option", { value:s, selected:d.status === s }, s ? STATUS[s] : "Todas as situações"))) : null;
  const apply = (e) => { e?.preventDefault(); Object.assign(d, { q:q.value.trim(), subject:subject.value.trim(), days:days.value, status:status?.value || "", page:1 }); render(); };
  const pages = Math.max(1, Math.ceil(page.total / page.page_size));
  return [
    header("Dados", kinds),
    el("form", { class:"toolbar", onsubmit:apply }, q, subject, days, status, el("button", { class:"primary", type:"submit" }, "Filtrar"),
      el("span", { class:"muted grow" }, `${fmt(page.total)} itens`)),
    el("div", { class:"panel" }, page.items.length ? el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Conteúdo"), el("th", {}, "Marcadores"), el("th", {}, "Criado em"), el("th", {}))),
      el("tbody", {}, page.items.map((row) => el("tr", { class:"click", onclick:() => showDetail(d.kind, row.id) },
        el("td", {}, el("strong", {}, row.title), row.detail ? el("div", { class:"muted clip" }, row.detail) : null),
        el("td", {}, row.tags.map((t) => el("span", { class:"badge" }, t))),
        el("td", {}, when(row.created_at)),
        el("td", {}, el("button", { class:"ghost", onclick:(e) => { e.stopPropagation(); remove(d.kind, row.id); } }, "Apagar"))))))
      : el("p", { class:"muted" }, "Nenhum item com estes filtros."),
      el("div", { class:"pager" },
        el("button", { disabled:d.page <= 1, onclick:() => { d.page--; render(); } }, "Anterior"),
        el("span", { class:"muted" }, `Página ${d.page} de ${pages}`),
        el("button", { disabled:d.page >= pages, onclick:() => { d.page++; render(); } }, "Próxima"))),
  ];
}

async function remove(kind, id) {
  const reason = prompt("Apagar este item? Não dá para desfazer. Motivo (opcional, fica no registro):");
  if (reason === null) return;
  try { await call(`/content/${kind}/${id}`, { method:"DELETE", body:JSON.stringify({ reason:reason || null }) }); closeDrawer(); render(); }
  catch (error) { alert(error.message); }
}

async function showDetail(kind, id) {
  const item = await call(`/content/${kind}/${id}`);
  openDrawer(
    el("div", { class:"toolbar" }, el("h2", { class:"grow" }, LABELS[kind]), el("button", { onclick:closeDrawer }, "Fechar")),
    el("p", { class:"muted" }, "Campos decifrados. Chaves anônimas de autoria ficam ocultas."),
    el("dl", {}, Object.entries(item).flatMap(([key, value]) => [el("dt", {}, key), el("dd", {}, value === null ? "—" : typeof value === "object" ? JSON.stringify(value) : String(value))])),
    el("div", { class:"toolbar" },
      kind === "material" ? el("a", { href:`${base}/materials/${id}/file`, download:"" }, el("button", {}, "Baixar arquivo")) : null,
      el("button", { class:"danger", onclick:() => remove(kind, id) }, "Apagar")));
}

function openDrawer(...children) { const drawer = $("#drawer"); drawer.replaceChildren(...children); drawer.classList.add("open"); }
function closeDrawer() { $("#drawer").classList.remove("open"); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

async function breakdown() {
  const b = await call("/breakdown");
  const panel = (title, content) => el("div", { class:"panel" }, el("h3", {}, title), content);
  return [
    header("Distribuições"),
    el("div", { class:"grid g2" },
      panel("Notas das avaliações", barChart(b.ratings.map((_, i) => `${i * 10}–${i * 10 + (i === 9 ? 10 : 9)}`), b.ratings, { height:180 })),
      panel("Chamada, segundo as avaliações", hbars(Object.entries(b.attendance), (k) => ({ cobra:"Cobra", nao_cobra:"Não cobra", varia:"Varia", sem:"Não informado" }[k] || k))),
      panel("Matérias com mais conteúdo", hbars(b.top_subjects.map((s) => [s.code, s.items]))),
      panel("Materiais por tipo", hbars(Object.entries(b.materials_by_kind))),
      panel("Publicações por campus", hbars(Object.entries(b.posts_by_campus), (k) => k === "sem" ? "Todos os campi" : k)),
      panel("Publicações por tipo", hbars(Object.entries(b.posts_by_kind))),
      panel("Guias por categoria", hbars(Object.entries(b.tutorials_by_category))),
      panel("Denúncias por motivo", hbars(Object.entries(b.reports_by_reason), (k) => REASONS[k] || k))),
  ];
}

  const toggle = (key, enabled) => el("input", { type:"checkbox", checked:enabled, "aria-label":key, onchange:async (e) => {

        meter("CPU da máquina", sys.cpu_percent, 100, `${sys.cpu_percent.toFixed(0)}% de ${sys.cpus} núcleos · carga ${sys.load_1m.toFixed(2)}`),
        meter("Memória", sys.memory_used_bytes, sys.memory_total_bytes, `${bytes(sys.memory_used_bytes)} de ${bytes(sys.memory_total_bytes)}`),
        meter("Disco (pasta dos materiais)", sys.disk_total_bytes - sys.disk_free_bytes, sys.disk_total_bytes, `${bytes(sys.disk_free_bytes)} livres de ${bytes(sys.disk_total_bytes)}`),
        el("p", { class:"muted" }, `Processo da API: ${bytes(o.process.memory_bytes)} de memória, ${o.process.threads} threads, no ar há ${duration(o.uptime_seconds)} · máquina ligada há ${duration(sys.boot_seconds)}`),
        el("p", { class:"muted" }, `Banco: ${bytes(o.database_bytes)}, ${o.database_connections} conexões · materiais: ${fmt(o.materials_files)} arquivos, ${bytes(o.materials_bytes)}`))),
    el("div", { class:"grid g2" },
      el("div", { class:"panel" }, el("h3", {}, "Cartões do menu Mais"),
        el("p", { class:"muted" }, "Esconda ou mostre cada cartão para todos os alunos (vale em até 1 minuto). As ferramentas de matrícula extraordinária ficam ligadas só no período que você escolher."),
        o.menu.map((item) => el("label", { class:"switch" }, el("span", {}, item.label), el("input", { type:"checkbox", checked:item.visible, "aria-label":item.label, onchange:async (e) => {
          try { await call(`/menu/${item.key}`, { method:"PUT", body:JSON.stringify({ visible:e.target.checked }) }); } catch (error) { alert(error.message); e.target.checked = !e.target.checked; }
        } })))),
      el("div", { class:"panel" }, el("h3", {}, "Links das ferramentas"),
        el("p", { class:"muted" }, "Só links https. Sem link, a ferramenta ligada aparece como “em breve”."),
        o.texts.map((item) => {
          const input = el("input", { type:"url", value:item.value, placeholder:"https://", maxlength:"300", style:"flex:1" });
          const status = el("span", { class:"muted" });
          return el("div", { class:"switch" }, el("div", { style:"flex:1;display:flex;flex-direction:column;gap:6px" }, el("span", {}, item.label),
            el("div", { class:"toolbar" }, input, el("button", { onclick:async () => {
              try { await call(`/texts/${item.key}`, { method:"PUT", body:JSON.stringify({ value:input.value.trim() }) }); status.textContent = "Salvo."; }
              catch (error) { status.textContent = error.message; }
            } }, "Salvar"), status)));
        }))),
    el("div", { class:"grid g2" },
      el("div", { class:"panel" }, el("h3", {}, "Armazenamento"),
        el("table", {}, el("tbody", {},
          el("tr", {}, el("td", {}, "Banco de dados (servidor)"), el("td", { class:"num" }, bytes(o.database_bytes))),
          el("tr", {}, el("td", {}, "Arquivos de materiais, cifrados (servidor)"), el("td", { class:"num" }, bytes(o.materials_bytes))),
          el("tr", {}, el("td", {}, `Aparelho de um aluno com ${o.device.typical_classrooms} turmas (estimativa)`), el("td", { class:"num" }, bytes(o.device.typical_bytes))),
          el("tr", {}, el("td", {}, "Cada turma a mais no aparelho"), el("td", { class:"num" }, bytes(o.device.per_classroom_bytes))))),

        el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Tabela"), el("th", { class:"num" }, "Linhas"), el("th", { class:"num" }, "Tamanho"))),
          el("tbody", {}, o.tables.map((t) => el("tr", {}, el("td", {}, t.table), el("td", { class:"num" }, fmt(t.rows)), el("td", { class:"num" }, bytes(t.bytes))))))),
